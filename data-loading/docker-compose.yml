# Neo4j for the Trace knowledge graph.
#
# Run it from this folder, pointing at the repo-root .env for the password:
#
#     docker compose --env-file ../.env up -d
#     docker compose --env-file ../.env down          # stop, keep the data
#     docker volume rm data-loading_neo4j-data        # throw the graph away
#
# Then open http://localhost:7474 and log in as `neo4j`.
#
# Memory: this machine's Docker VM has ~3.9 GB total, so heap + page cache are
# sized to fit inside it with room for the JVM's own overhead. A ~1.1M node
# store does not fit entirely in a 768 MB page cache, which makes the load
# disk-bound rather than memory-bound -- correct for this machine, but if you
# ever raise Docker's memory limit, raising pagecache to 2G is the single
# change that will speed loading and querying the most.
#
# `db.transaction.timeout` is generous because the enrich stage rewrites
# properties across all 346,947 vulnerability nodes in batched transactions.

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: trace-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (the web UI)
      - "7687:7687"   # Bolt (what the Python driver speaks)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in the repo-root .env}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_initial__size: 1536m
      NEO4J_server_memory_heap_max__size: 1536m
      NEO4J_server_memory_pagecache_size: 768m
      NEO4J_db_transaction_timeout: 60m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j-data:
  neo4j-logs:
