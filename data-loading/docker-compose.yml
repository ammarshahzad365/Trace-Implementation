# Neo4j for the Trace knowledge graph -- the local development option.
#
# Run it from this folder, pointing at the repo-root .env for the password:
#
#     docker compose --env-file ../.env up -d
#     docker compose --env-file ../.env down          # stop, keep the data
#     docker volume rm data-loading_neo4j-data        # throw the graph away
#
# Then open http://localhost:7474 and log in as `neo4j`.
#
# On a machine without Docker -- a shared university host, say -- install the
# tarball into your home directory instead. See the README, "Starting a
# database", which also covers the two settings below that have no equivalent
# there.
#
# Memory: heap holds the working set of a transaction, page cache holds the
# store. These two values are sized for a Docker VM with about 3.9 GB, which is
# the default on a Windows host -- Neo4j refuses to start at all if
# `heap.max + pagecache` exceeds physical memory, so raising them without
# raising Docker's own limit first turns into a container that restarts forever
# with "Invalid memory configuration" in `docker logs trace-neo4j`.
#
# If you do give Docker more, page cache is the one worth raising: the whole
# graph is about 373,000 nodes and 393,000 relationships, and a page cache big
# enough to hold the store keeps querying in memory after the load.
#
# `db.transaction.timeout` is generous because a batch of 10,000 CVE nodes with
# long descriptions is a big single transaction.

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: trace-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (the web UI)
      - "7687:7687"   # Bolt (what the Python driver speaks)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in the repo-root .env}
      NEO4J_server_memory_heap_initial__size: 1536m
      NEO4J_server_memory_heap_max__size: 1536m
      NEO4J_server_memory_pagecache_size: 1g
      NEO4J_db_transaction_timeout: 60m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j-data:
  neo4j-logs:
